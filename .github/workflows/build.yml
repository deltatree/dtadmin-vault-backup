name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t dtadmin-vault-backup:test .
      - name: Image prüfen (echte Vaultwarden-Daten)
        run: sh test/test.sh dtadmin-vault-backup:test
      - name: Bei ghcr.io anmelden
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Image hochladen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/dtadmin-vault-backup
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag dtadmin-vault-backup:test "$IMG:$VERSION"
          docker push "$IMG:$VERSION"
